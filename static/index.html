<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OSINT Hub — Multi-Platform</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<style>
::-webkit-scrollbar{width:8px;height:8px}::-webkit-scrollbar-thumb{background:#3f3f46;border-radius:8px}
.glass{backdrop-filter:blur(12px);background:rgba(24,24,27,.8)}
pre{white-space:pre-wrap;word-break:break-all}
.line-clamp-2{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
</style>
</head>
<body class="bg-[#09090b] text-zinc-100 min-h-screen">
<header class="sticky top-0 z-20 border-b border-zinc-800 glass">
  <div class="max-w-7xl mx-auto px-4 py-3 flex items-center justify-between">
    <div class="flex items-center gap-3">
      <div class="w-9 h-9 rounded-xl bg-white text-black flex items-center justify-center font-black text-sm">OS</div>
      <div><h1 class="font-bold leading-none">OSINT HUB</h1><p class="text-[11px] text-zinc-500">Multi-Platform OSINT</p></div>
    </div>
    <div class="flex gap-2">
      <a href="/docs" target="_blank" class="text-[11px] px-3 py-1.5 rounded-lg bg-zinc-900 border border-zinc-800 hover:bg-zinc-800">API Docs</a>
    </div>
  </div>
</header>

<main class="max-w-7xl mx-auto px-4 py-6">
  <!-- Platform Selector -->
  <div class="mb-6 flex flex-wrap gap-2">
    <button data-platform="github" class="plat-btn active px-4 py-2.5 rounded-xl text-sm font-semibold flex items-center gap-2 bg-white text-black"><i class="fa-brands fa-github"></i>GitHub</button>
    <button data-platform="tiktok" class="plat-btn px-4 py-2.5 rounded-xl text-sm font-semibold flex items-center gap-2 bg-zinc-900 border border-zinc-800 hover:bg-zinc-800"><i class="fa-brands fa-tiktok"></i>TikTok</button>
    <button data-platform="instagram" class="plat-btn px-4 py-2.5 rounded-xl text-sm font-semibold flex items-center gap-2 bg-zinc-900 border border-zinc-800 hover:bg-zinc-800"><i class="fa-brands fa-instagram"></i>Instagram</button>
    <button data-platform="twitter" class="plat-btn px-4 py-2.5 rounded-xl text-sm font-semibold flex items-center gap-2 bg-zinc-900 border border-zinc-800 hover:bg-zinc-800"><i class="fa-brands fa-x-twitter"></i>Twitter/X</button>
    <button data-platform="youtube" class="plat-btn px-4 py-2.5 rounded-xl text-sm font-semibold flex items-center gap-2 bg-zinc-900 border border-zinc-800 hover:bg-zinc-800"><i class="fa-brands fa-youtube"></i>YouTube</button>
    <button data-platform="discord" class="plat-btn px-4 py-2.5 rounded-xl text-sm font-semibold flex items-center gap-2 bg-zinc-900 border border-zinc-800 hover:bg-zinc-800"><i class="fa-brands fa-discord"></i>Discord</button>
  </div>

  <!-- Search Bar -->
  <div class="rounded-2xl border border-zinc-800 bg-zinc-900 p-4 mb-4">
    <div id="inputArea" class="flex gap-2"></div>
    <div class="mt-3 flex flex-wrap gap-2 text-[11px] text-zinc-500">
      <span>Try:</span>
      <div id="examples" class="flex flex-wrap gap-1"></div>
    </div>
  </div>

  <div id="status" class="hidden rounded-xl border px-4 py-3 text-sm mb-4"></div>
  <div id="results" class="space-y-4">
    <div class="rounded-2xl border border-dashed border-zinc-800 p-10 text-center">
      <div class="w-12 h-12 mx-auto rounded-2xl bg-zinc-900 border border-zinc-800 flex items-center justify-center"><i class="fa-solid fa-satellite-dish text-zinc-500"></i></div>
      <h3 class="mt-4 font-semibold">Pick a platform above and search a username</h3>
      <p class="text-sm text-zinc-500 max-w-lg mx-auto">Each platform uses public APIs or web scraping — no auth needed. Data varies by platform availability.</p>
    </div>
  </div>
</main>

<script src="/static/app.js"></script>
</body>
</html>
